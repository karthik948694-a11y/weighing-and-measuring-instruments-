<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MetroBot – Legal Metrology Assistant</title>
  <meta name="description" content="AI-powered chatbot assistant for Legal Metrology Verification System. Get help with certificate verification, complaints, and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --plum:        #5C1D48;
      --plum-light:  #7B2860;
      --plum-dark:   #471437;
      --milk:        #FAF6F0;
      --milk-deep:   #F0EAE1;
      --milk-line:   #E2D9CC;
      --navy:        #5C1D48;
      --navy-light:  #471437;
      --gold:        #5C1D48;
      --gold-light:  #7B2860;
      --accent:      #7B2860;
      --accent-glow: rgba(92, 29, 72, 0.25);
      --bg:          #FAF6F0;
      --surface:     #FFFFFF;
      --surface-2:   #F5EFE6;
      --border:      #E2D9CC;
      --text:        #231820;
      --text-muted:  #7E6E79;
      --bot-bubble:  #FFFDF9;
      --user-bubble: #5C1D48;
      --shadow:      0 10px 24px rgba(40, 15, 32, 0.10);
      --radius:      16px;
      --font:        'Inter', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .chat-wrapper {
      position: relative; z-index: 10;
      width: min(500px, 96vw);
      height: min(700px, 94vh);
      display: flex; flex-direction: column;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow), 0 0 0 1px rgba(255,255,255,.04) inset;
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .chat-header {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 20px;
      background: linear-gradient(135deg, var(--plum) 0%, var(--plum-dark) 100%);
      border-bottom: 1px solid rgba(255,255,255,.12);
      flex-shrink: 0;
    }
    .header-avatar {
      width: 36px; height: 36px; border-radius: 8px;
      background: rgba(255,255,255,.18);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #fff;
      flex-shrink: 0;
      position: relative;
    }
    .status-dot {
      position: absolute; bottom: 2px; right: 2px;
      width: 10px; height: 10px; border-radius: 50%;
      background: #22c55e;
      border: 2px solid var(--plum);
      box-shadow: 0 0 6px #22c55e;
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%,100% { box-shadow: 0 0 6px #22c55e; }
      50%      { box-shadow: 0 0 14px #22c55e; }
    }
    .header-info h2 {
      font-size: 15px; font-weight: 700; color: #fff;
      letter-spacing: .3px;
    }
    .header-info p {
      font-size: 11px; color: rgba(255,255,255,.85); font-weight: 500;
      margin-top: 2px;
    }
    .header-actions { margin-left: auto; display: flex; gap: 8px; }
    .hdr-btn {
      padding: 4px 10px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.1);
      color: #fff;
      cursor: pointer; font-size: 12px; font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
    }
    .hdr-btn:hover { background: rgba(255,255,255,.2); color: #fff; transform: scale(1.04); }

    .quick-chips {
      display: flex; gap: 8px; flex-wrap: wrap;
      padding: 10px 16px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .chip {
      padding: 5px 12px; border-radius: 20px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--plum); font-size: 11.5px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
      transition: all .2s;
    }
    .chip:hover {
      background: var(--milk-deep);
      border-color: var(--plum);
      transform: translateY(-1px);
    }

    .messages {
      flex: 1; overflow-y: auto;
      padding: 20px 16px;
      display: flex; flex-direction: column; gap: 14px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg-row {
      display: flex; gap: 10px; align-items: flex-end;
      animation: slide-in .3s cubic-bezier(.25,.8,.25,1) both;
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .msg-row.bot  .msg-avatar { background: var(--milk-deep, #F0EAE1); color: var(--plum); font-size: 10px; font-weight: 700; border: 1px solid var(--border); }
    .msg-row.user .msg-avatar { background: var(--plum); color: #fff; font-size: 10px; font-weight: 700; }

    .bubble {
      max-width: 78%; padding: 11px 15px;
      border-radius: 16px; line-height: 1.55;
      font-size: 13.5px; word-break: break-word;
      position: relative;
    }
    .msg-row.bot  .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }
    .msg-row.user .bubble {
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
      color: #fff;
    }
    .bubble .time {
      display: block; font-size: 10px; color: var(--text-muted);
      margin-top: 5px; text-align: right;
    }
    .bubble strong { color: var(--plum); }
    .bubble a { color: var(--plum); }
    .bubble ul { padding-left: 16px; margin-top: 4px; }
    .bubble ul li { margin-bottom: 3px; }

    .typing-indicator {
      display: none; align-items: center; gap: 5px;
      padding: 12px 15px;
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-radius: 16px; border-bottom-left-radius: 4px;
      max-width: 70px;
    }
    .typing-indicator.active { display: flex; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--plum); opacity: .4;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%,80%,100% { transform: scale(.8); opacity:.4; }
      40%          { transform: scale(1.2); opacity:1; }
    }

    .input-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px;
      background: var(--plum);
      border-top: 1px solid rgba(255,255,255,.12);
      flex-shrink: 0;
    }
    #user-input {
      flex: 1; border: 1px solid rgba(255,255,255,.25);
      background: rgba(255,255,255,.14);
      color: #fff;
      border-radius: 12px; padding: 10px 15px;
      font-size: 13.5px; font-family: var(--font);
      outline: none; resize: none;
      transition: border-color .2s, box-shadow .2s;
      max-height: 100px; overflow-y: auto;
      line-height: 1.5;
    }
    #user-input::placeholder { color: rgba(255,255,255,.7); }
    #user-input:focus {
      border-color: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(255,255,255,.25);
    }
    #send-btn {
      width: 42px; height: 42px; border-radius: 10px; flex-shrink: 0;
      background: rgba(255,255,255,.2);
      border: 1px solid rgba(255,255,255,.3); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s ease;
    }
    #send-btn:hover { background: rgba(255,255,255,.3); }
    #send-btn svg { width: 18px; height: 18px; fill: #fff; }

    .footer-note {
      text-align: center; font-size: 10.5px; color: rgba(255,255,255,.75);
      padding: 6px 12px 10px;
      background: var(--plum);
    }
  </style>
</head>
<body>

<div class="chat-wrapper" id="chat-wrapper">

  <div class="chat-header">
    <div class="header-avatar">
      MB
      <span class="status-dot"></span>
    </div>
    <div class="header-info">
      <h2>MetroBot</h2>
      <p>Legal Metrology Assistant &middot; Online</p>
    </div>
    <div class="header-actions">
      <a href="index.html" class="hdr-btn" style="text-decoration:none; display:flex; align-items:center; gap:4px;">&larr; Home</a>
      <button class="hdr-btn" id="clear-btn" title="Clear chat">Clear</button>
    </div>
  </div>

  <div class="quick-chips" id="chips">
    <span class="chip" data-q="How do I verify a certificate?">Verify certificate</span>
    <span class="chip" data-q="How to file a complaint?">File complaint</span>
    <span class="chip" data-q="What is legal metrology?">About</span>
    <span class="chip" data-q="I need officer contact">Contact officer</span>
    <span class="chip" data-q="What documents are required?">Documents</span>
  </div>

  <div class="messages" id="messages"></div>

  <div style="padding: 0 16px 6px; display:none;" id="typing-row">
    <div class="msg-row bot" style="gap:10px;align-items:flex-end;">
      <div class="msg-avatar">MB</div>
      <div class="typing-indicator active" id="typing-indicator">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <textarea id="user-input" placeholder="Ask me anything about legal metrology..." rows="1"></textarea>
    <button id="send-btn" aria-label="Send message">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>

  <div class="footer-note">Government of India · Legal Metrology Division · Informational only</div>
</div>

<script>
/* ════════════════════════════════════
   KNOWLEDGE BASE
   ════════════════════════════════════ */
var KB = [
  {
    patterns: [/\b(hi|hello|hey|good\s*(morning|afternoon|evening)|namaste|halo|helo)\b/i],
    responses: [
      "&#128075; Hello! Welcome to the <strong>Legal Metrology Verification System</strong>. I'm MetroBot, your assistant. How can I help you today?",
      "&#128075; Namaste! I'm MetroBot. Ask me anything about certificate verification, complaints, or legal metrology regulations."
    ]
  },
  {
    patterns: [/\b(who are you|what are you|your name|introduce yourself|what is metrobot)\b/i],
    responses: [
      "I'm <strong>MetroBot</strong> &#129302; &mdash; an AI assistant for the <strong>Legal Metrology Verification System</strong>. I can help you with:<ul><li>Certificate verification</li><li>Filing complaints</li><li>Understanding regulations</li><li>Connecting with officers</li></ul>What would you like to know?"
    ]
  },
  {
    patterns: [/\b(what is legal metrology|legal metrology mean|about legal metrology|explain metrology)\b/i],
    responses: [
      "<strong>Legal Metrology</strong> &#9878; is the branch of measurement science that deals with the application of measurements in mandatory regulations.<br><br>In India, it ensures:<ul><li>Accuracy of weighing &amp; measuring instruments used in trade</li><li>Consumer protection from faulty weights/measures</li><li>Certification &amp; stamping of all commercial instruments</li><li>Enforcement under the <strong>Legal Metrology Act, 2009</strong></li></ul>"
    ]
  },
  {
    patterns: [/\b(verify|verification|check|validate|certificate|cert)\b.*\b(how|steps|process|procedure|guide)\b|\b(how to|how do i|steps to|process for|procedure for)\b.*\b(verify|verification|check|validate|certificate)\b/i],
    responses: [
      "To verify a weighing/measuring instrument certificate:<br><br><strong>Step 1</strong> &ndash; Visit the <a href='verify.html'>Verification Page</a> on this portal.<br><strong>Step 2</strong> &ndash; Enter the <strong>Certificate Number</strong> or scan the <strong>QR code</strong> on the instrument.<br><strong>Step 3</strong> &ndash; Click <em>Verify Now</em>.<br><strong>Step 4</strong> &ndash; View the certificate status (Valid / Expired / Invalid).<br><br>&#128204; <em>A valid certificate shows the instrument name, owner details, verification date, and expiry date.</em>"
    ]
  },
  {
    patterns: [/\b(qr|qr code|scan|barcode)\b/i],
    responses: [
      "&#128247; <strong>QR Code Scanning:</strong><br><br>Every certified weighing/measuring instrument has a QR sticker. You can:<ul><li>Scan it with your phone camera to instantly verify</li><li>Or paste the certificate number from the QR into the <a href='verify.html'>Verify Page</a></li></ul>QR codes contain the certificate ID, instrument details, and validity period."
    ]
  },
  {
    patterns: [/\b(complaint|complain|report|lodge|file|submit|raise)\b.*\b(how|process|steps|where)\b|\b(how to|how do i|where to|steps to)\b.*\b(complaint|complain|report|lodge|file)\b/i],
    responses: [
      "&#128203; <strong>Filing a Complaint:</strong><br><br><strong>Step 1</strong> &ndash; Go to the <a href='complaint.html'>Complaint Page</a>.<br><strong>Step 2</strong> &ndash; Select the type of violation (faulty weight, no certificate, overcharging).<br><strong>Step 3</strong> &ndash; Fill in:<ul><li>Seller / shop name &amp; location</li><li>Description of the issue</li><li>Upload photo evidence (optional)</li></ul><strong>Step 4</strong> &ndash; Submit &mdash; you'll receive a <strong>Complaint Reference Number</strong>.<br><br>&#9200; Complaints are reviewed within <strong>7 working days</strong>."
    ]
  },
  {
    patterns: [/\b(track|status|check status|follow up|update)\b.*\b(complaint|application)\b|\b(complaint|application)\b.*\b(status|track|update)\b/i],
    responses: [
      "&#128270; <strong>Track Complaint Status:</strong><br><br>Use your <strong>Complaint Reference Number</strong> on the <a href='complaint.html'>Complaint Page</a> &rarr; Track Status section.<br><br>Status codes:<ul><li>&#127825; <strong>Pending</strong> &ndash; Under review</li><li>&#128309; <strong>In Progress</strong> &ndash; Officer assigned</li><li>&#128994; <strong>Resolved</strong> &ndash; Action taken</li><li>&#128308; <strong>Closed</strong> &ndash; No violation found</li></ul>"
    ]
  },
  {
    patterns: [/\b(documents?|docs?|required|need|papers?|submit)\b.*\b(certif|verif|stamping|apply|application|renewal)\b|\b(what documents?|what papers?)\b/i],
    responses: [
      "&#128196; <strong>Documents Required for Verification/Stamping:</strong><br><br><ul><li>&#9989; Business Registration / GST Certificate</li><li>&#9989; Previous verification certificate (for renewal)</li><li>&#9989; Instrument purchase invoice</li><li>&#9989; Instrument make, model &amp; serial number details</li><li>&#9989; Owner ID proof (Aadhaar / PAN)</li><li>&#9989; Shop address proof</li></ul><br>&#128204; Carry originals along with 2 sets of photocopies."
    ]
  },
  {
    patterns: [/\b(renew|renewal|re-verify|reissue|expired certificate)\b/i],
    responses: [
      "&#128260; <strong>Certificate Renewal:</strong><br><br>Verification certificates are valid for <strong>1&ndash;2 years</strong> depending on instrument type. To renew:<ul><li>Apply at least <strong>30 days before expiry</strong></li><li>Submit renewal form on the portal or at your district Legal Metrology office</li><li>An officer will inspect the instrument on-site</li><li>Pay the applicable renewal fee</li></ul><br>&#9888; Using an expired certificate is punishable under the Legal Metrology Act."
    ]
  },
  {
    patterns: [/\b(officer|contact|helpdesk|support|phone|call|email|address|office)\b/i],
    responses: [
      "&#128222; <strong>Contact Legal Metrology Officers:</strong><br><br>Officers can be reached via the <a href='officer-dashboard.html'>Officer Dashboard</a> or through your district office.<br><br>&#128231; Email: <strong>legalmetrology@gov.in</strong><br>&#9990; Helpline: <strong>1800-XXX-XXXX</strong> (Toll-free, 9am&ndash;6pm)<br>&#127970; District offices: <strong>Mon&ndash;Fri, 10am&ndash;5pm</strong>."
    ]
  },
  {
    patterns: [/\b(fee|fees|charge|cost|payment|pay|price|amount|how much)\b/i],
    responses: [
      "&#128176; <strong>Verification Fees (Approx.):</strong><br><br><ul><li>&#9878; Platform / Weighbridge: &#8377;500&ndash;&#8377;2,000</li><li>&#128107; Retail weighing scales: &#8377;100&ndash;&#8377;300</li><li>&#128207; Measuring tapes/rulers: &#8377;50&ndash;&#8377;150</li><li>&#129514; Liquid dispensers: &#8377;200&ndash;&#8377;500</li></ul><br>Fees vary by state and instrument category."
    ]
  },
  {
    patterns: [/\b(penalty|penalt|fine|punish|illegal|offence|offense|violation|law|act)\b/i],
    responses: [
      "&#9888; <strong>Penalties under Legal Metrology Act, 2009:</strong><br><br><ul><li>Using <strong>unverified instrument</strong>: Fine up to &#8377;25,000 + imprisonment up to 6 months</li><li><strong>Tampering</strong> with instrument: Fine up to &#8377;50,000 + imprisonment up to 1 year</li><li><strong>False mark / stamp</strong>: Fine up to &#8377;1 lakh + imprisonment up to 2 years</li><li><strong>Repeat offences</strong>: Enhanced penalties apply</li></ul>"
    ]
  },
  {
    patterns: [/\b(owner|dashboard|my account|login|register|sign up|signup)\b/i],
    responses: [
      "&#127968; <strong>Owner Dashboard:</strong><br><br>As a registered owner you can:<ul><li>View all your instrument certificates</li><li>Check validity and renewal dates</li><li>Download/print certificates</li><li>Apply for new verifications</li><li>Track complaints you've filed</li></ul>&#128073; <a href='login.html'>Login here</a> or <a href='index.html'>register on the homepage</a>."
    ]
  },
  {
    patterns: [/\b(instruments?|weighing|measuring|scale|weight|measure|balance|dispenser|meter|petrol pump|fuel pump)\b/i],
    responses: [
      "&#9878; <strong>Instruments covered under Legal Metrology:</strong><br><br><ul><li>&#127978; Retail weighing scales &amp; balances</li><li>&#127959; Weighbridges &amp; platform scales</li><li>&#9981; Petrol/fuel dispensers</li><li>&#128207; Measuring tapes, rulers, gauges</li><li>&#129514; Liquid measuring containers</li><li>&#127973; Clinical thermometers (commercial)</li><li>&#127981; Industrial bulk weighing systems</li></ul><br>All instruments used in <em>trade or commerce</em> must be verified."
    ]
  },
  {
    patterns: [/\b(application|apply|applied)\b.*\b(status|track|when|how long)\b|\b(when will|how long)\b.*\b(certif|verif|stamping)\b/i],
    responses: [
      "&#128202; <strong>Application Status Timeline:</strong><br><br><ul><li>&#9203; <strong>Review:</strong> 1&ndash;3 working days</li><li>&#128104; <strong>Officer assignment:</strong> 2&ndash;5 working days</li><li>&#128270; <strong>Instrument inspection:</strong> Scheduled visit</li><li>&#128220; <strong>Certificate issuance:</strong> 1&ndash;2 days after inspection</li></ul><br>Total time: typically <strong>7&ndash;15 working days</strong>. Track via <a href='owner-dashboard.html'>Owner Dashboard</a>."
    ]
  },
  {
    patterns: [/\b(thank|thanks|thank you|thx|tysm|bye|goodbye|see you|exit|done)\b/i],
    responses: [
      "&#128522; You're welcome! If you need anything else about Legal Metrology, I'm always here. Have a great day! &#127470;&#127475;",
      "&#128075; Thank you for using MetroBot! Stay compliant and have a wonderful day!"
    ]
  },
  {
    patterns: [/\b(help|what can you do|options|menu|commands|features)\b/i],
    responses: [
      "&#128717; <strong>I can help you with:</strong><br><br><ul><li>&#128269; Certificate verification steps</li><li>&#128203; Filing &amp; tracking complaints</li><li>&#128196; Documents required</li><li>&#128176; Fee information</li><li>&#9878; Penalties &amp; regulations</li><li>&#128222; Officer contacts</li><li>&#128260; Certificate renewal</li><li>&#127968; Owner dashboard guidance</li><li>&#8505; About Legal Metrology</li></ul><br>Just type your question naturally!"
    ]
  }
];

var FALLBACKS = [
  "&#129300; I'm not sure I understood that. Could you rephrase? You can ask about certificate verification, complaints, fees, or regulations.",
  "&#128517; Hmm, that one's outside my knowledge base. Try asking about: verification, complaints, documents, or penalties.",
  "&#128269; I didn't catch that. Use the quick chips above, or ask me about verification, filing a complaint, or legal metrology rules."
];

/* ════════════════════════════════════
   CHAT ENGINE
   ════════════════════════════════════ */
var messagesEl   = document.getElementById('messages');
var inputEl      = document.getElementById('user-input');
var sendBtn      = document.getElementById('send-btn');
var clearBtn     = document.getElementById('clear-btn');
var typingRow    = document.getElementById('typing-row');
var fallbackIdx  = 0;

function nowTime() {
  return new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function getResponse(text) {
  var t = text.trim().toLowerCase();
  for (var i = 0; i < KB.length; i++) {
    var item = KB[i];
    for (var j = 0; j < item.patterns.length; j++) {
      if (item.patterns[j].test(t)) {
        return pick(item.responses);
      }
    }
  }
  var fb = FALLBACKS[fallbackIdx % FALLBACKS.length];
  fallbackIdx++;
  return fb;
}

function appendMsg(who, html) {
  var row = document.createElement('div');
  row.className = 'msg-row ' + who;

  var avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = who === 'bot' ? 'MB' : 'You';

  var bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = html + '<span class="time">' + nowTime() + '</span>';

  row.appendChild(avatar);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping(ms) {
  typingRow.style.display = 'block';
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return new Promise(function(res) {
    setTimeout(function() {
      typingRow.style.display = 'none';
      res();
    }, ms);
  });
}

function handleSend() {
  var txt = inputEl.value.trim();
  if (!txt) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  appendMsg('user', txt);
  var delay = 600 + Math.random() * 700;
  showTyping(delay).then(function() {
    appendMsg('bot', getResponse(txt));
  });
}

sendBtn.addEventListener('click', handleSend);

inputEl.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

inputEl.addEventListener('input', function() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
});

document.querySelectorAll('.chip').forEach(function(chip) {
  chip.addEventListener('click', function() {
    inputEl.value = chip.dataset.q;
    handleSend();
  });
});

clearBtn.addEventListener('click', function() {
  messagesEl.innerHTML = '';
  appendMsg('bot', "Chat cleared. How can I assist you with Legal Metrology today?");
});

showTyping(1000).then(function() {
  appendMsg('bot',
    "Welcome to <strong>MetroBot</strong>. I can help with:<ul><li>Certificate verification</li><li>Filing complaints</li><li>Regulations and penalties</li><li>Required documents</li></ul>Use the buttons above or type a question."
  );
});
</script>
</body>
</html>
